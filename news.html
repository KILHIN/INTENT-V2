<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intent — Actus</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap');
    :root {
      --bg:#08090c;--surface:#111218;--border:rgba(255,255,255,0.07);
      --text:#eeeef3;--muted:rgba(255,255,255,0.38);
      --geo:#f7971e;--foot:#43e97b;--sport:#f953c6;--tech:#4facfe;--finance:#a78bfa;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:48px;}
    header{padding:28px 20px 16px;display:flex;align-items:baseline;gap:10px;}
    header h1{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;}
    .headerBack{font-size:13px;color:var(--muted);text-decoration:none;}
    .headerDate{margin-left:auto;font-size:11px;color:var(--muted);font-weight:300;}
    .tabs{display:flex;gap:6px;padding:0 16px 20px;overflow-x:auto;scrollbar-width:none;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{flex-shrink:0;padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;white-space:nowrap;}
    .tab.active{color:var(--bg);border-color:transparent;font-weight:700;}
    .tab[data-cat="geo"].active    {background:var(--geo);}
    .tab[data-cat="foot"].active   {background:var(--foot);}
    .tab[data-cat="sport"].active  {background:var(--sport);}
    .tab[data-cat="tech"].active   {background:var(--tech);}
    .tab[data-cat="finance"].active{background:var(--finance);}
    .panels{padding:0 16px;display:flex;flex-direction:column;gap:8px;}
    .panel{display:none;flex-direction:column;gap:8px;}
    .panel.active{display:flex;}
    .accentBar{height:2px;width:28px;margin-bottom:4px;border-radius:1px;}
    .accentBar[data-cat="geo"]    {background:var(--geo);}
    .accentBar[data-cat="foot"]   {background:var(--foot);}
    .accentBar[data-cat="sport"]  {background:var(--sport);}
    .accentBar[data-cat="tech"]   {background:var(--tech);}
    .accentBar[data-cat="finance"]{background:var(--finance);}
    .siteLink{
      display:flex;align-items:center;gap:14px;
      padding:14px 16px;
      background:var(--surface);border:1px solid var(--border);
      border-radius:14px;text-decoration:none;color:inherit;
      -webkit-tap-highlight-color:transparent;transition:background 0.12s;
    }
    .siteLink:active{background:rgba(255,255,255,0.08);}
    .siteFlag{font-size:20px;width:28px;text-align:center;flex-shrink:0;}
    .siteBody{flex:1;display:flex;flex-direction:column;gap:2px;}
    .siteName{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;}
    .siteDesc{font-size:12px;color:var(--muted);font-weight:300;}
    .siteArrow{font-size:15px;color:var(--muted);}
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="headerBack">← Intent</a>
    <h1>Actus</h1>
    <span class="headerDate" id="headerDate"></span>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="panels" id="panels"></div>
  <script>
  const CATEGORIES = [
    { id:"geo", label:"🌍 Géopolitique", sites:[
      { flag:"🇫🇷", name:"Le Monde",            desc:"La référence de l'info internationale",  url:"https://www.lemonde.fr/international" },
      { flag:"🇫🇷", name:"Le Figaro International", desc:"Actualité géopolitique mondiale",    url:"https://www.lefigaro.fr/international" },
      { flag:"🇫🇷", name:"Courrier International", desc:"La presse mondiale traduite en français", url:"https://www.courrierinternational.com" },
      { flag:"🇫🇷", name:"Orient XXI",          desc:"Spécialiste Moyen-Orient & monde arabe", url:"https://orientxxi.info" },
      { flag:"🇫🇷", name:"Le Grand Continent",  desc:"Analyses géopolitiques de fond",         url:"https://legrandcontinent.eu/fr" }
    ]},
    { id:"foot", label:"⚽ Foot", sites:[
      { flag:"🇫🇷", name:"L'Équipe",            desc:"Résultats, transferts, toute l'actu foot", url:"https://www.lequipe.fr/Football" },
      { flag:"🇫🇷", name:"RMC Sport",           desc:"Foot en direct, mercato, interviews",    url:"https://rmcsport.bfmtv.com/football" },
      { flag:"🇫🇷", name:"Foot Mercato",        desc:"Spécialiste transferts & mercato",       url:"https://www.footmercato.net" },
      { flag:"🇫🇷", name:"So Foot",             desc:"Foot culture, longues lectures",         url:"https://www.sofoot.com" },
      { flag:"🌍", name:"Transfermarkt",        desc:"Valeurs marchandes & transferts (EN/FR)", url:"https://www.transfermarkt.fr" }
    ]},
    { id:"sport", label:"🏅 Sport FR", sites:[
      { flag:"🇫🇷", name:"L'Équipe",            desc:"Tous les sports, résultats en direct",   url:"https://www.lequipe.fr" },
      { flag:"🇫🇷", name:"Eurosport",           desc:"Sport en direct & replay",               url:"https://www.eurosport.fr" },
      { flag:"🇫🇷", name:"RMC Sport",           desc:"Actu sport, résultats, analyses",        url:"https://rmcsport.bfmtv.com" },
      { flag:"🇫🇷", name:"Le 10 Sport",         desc:"Sport FR, mercato, exclus",              url:"https://le10sport.com" },
      { flag:"🇫🇷", name:"France TV Sport",     desc:"JO, sport amateur & professionnel",      url:"https://sport.france.tv" }
    ]},
    { id:"tech", label:"⚡ Tech & IA", sites:[
      { flag:"🇫🇷", name:"01net",               desc:"High-tech, tests produits, actu numérique", url:"https://www.01net.com" },
      { flag:"🇫🇷", name:"Numerama",            desc:"Tech, IA & société numérique",           url:"https://www.numerama.com" },
      { flag:"🇫🇷", name:"Frandroid",           desc:"Android, smartphones, tech",             url:"https://www.frandroid.com" },
      { flag:"🇫🇷", name:"Next.ink",            desc:"Journalisme tech indépendant & de fond", url:"https://next.ink" },
      { flag:"🌍", name:"The Verge",            desc:"Référence mondiale tech & IA (EN)",      url:"https://www.theverge.com" }
    ]},
    { id:"finance", label:"📈 Finance", sites:[
      { flag:"🇫🇷", name:"Les Échos",           desc:"Économie, marchés, entreprises",         url:"https://www.lesechos.fr" },
      { flag:"🇫🇷", name:"BFM Business",        desc:"Marchés en direct, économie FR & monde", url:"https://bfmbusiness.bfmtv.com" },
      { flag:"🇫🇷", name:"La Tribune",          desc:"Économie, finance, innovation",          url:"https://www.latribune.fr" },
      { flag:"🇫🇷", name:"Boursorama",          desc:"Bourse, cours en direct, actualités",    url:"https://www.boursorama.com/bourse/actualites" },
      { flag:"🇫🇷", name:"Zone Bourse",         desc:"Analyses & données marchés",             url:"https://www.zonebourse.com" }
    ]}
  ];

  document.getElementById("headerDate").textContent =
    new Date().toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long" });

  let currentCat = sessionStorage.getItem("news_cat") || "geo";

  const tabsEl   = document.getElementById("tabs");
  const panelsEl = document.getElementById("panels");

  CATEGORIES.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "tab" + (cat.id === currentCat ? " active" : "");
    btn.dataset.cat = cat.id;
    btn.textContent = cat.label;
    btn.addEventListener("click", () => selectCat(cat.id));
    tabsEl.appendChild(btn);

    const panel = document.createElement("div");
    panel.className = "panel" + (cat.id === currentCat ? " active" : "");
    panel.dataset.cat = cat.id;
    panel.innerHTML =
      '<div class="accentBar" data-cat="' + cat.id + '"></div>' +
      cat.sites.map(s =>
        '<a class="siteLink" href="' + s.url + '" target="_blank" rel="noopener noreferrer">' +
          '<span class="siteFlag">' + s.flag + '</span>' +
          '<div class="siteBody">' +
            '<span class="siteName">' + s.name + '</span>' +
            '<span class="siteDesc">' + s.desc + '</span>' +
          '</div>' +
          '<span class="siteArrow">↗</span>' +
        '</a>'
      ).join("");
    panelsEl.appendChild(panel);
  });

  function selectCat(id) {
    currentCat = id;
    sessionStorage.setItem("news_cat", id);
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.cat === id));
    document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.dataset.cat === id));
  }
  </script>
</body>
</html>
