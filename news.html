<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intent — Actus</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap');
    :root {
      --bg:#08090c;--surface:#111218;--border:rgba(255,255,255,0.07);
      --text:#eeeef3;--muted:rgba(255,255,255,0.38);--dim:rgba(255,255,255,0.10);
      --tech:#4facfe;--foot:#43e97b;--geo:#f7971e;--finance:#a78bfa;--sport:#f953c6;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:48px;}
    header{padding:28px 20px 12px;display:flex;align-items:baseline;gap:10px;}
    header h1{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;}
    .headerBack{font-size:13px;color:var(--muted);text-decoration:none;}
    .headerDate{margin-left:auto;font-size:11px;color:var(--muted);font-weight:300;}
    .tabs{display:flex;gap:6px;padding:0 16px 14px;overflow-x:auto;scrollbar-width:none;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{flex-shrink:0;padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;white-space:nowrap;}
    .tab.active{color:var(--bg);border-color:transparent;font-weight:700;}
    .tab[data-cat="tech"].active{background:var(--tech);}
    .tab[data-cat="foot"].active{background:var(--foot);}
    .tab[data-cat="geo"].active{background:var(--geo);}
    .tab[data-cat="finance"].active{background:var(--finance);}
    .tab[data-cat="sport"].active{background:var(--sport);}
    .feed{padding:0 16px;}
    .accentBar{height:2px;width:28px;margin-bottom:14px;border-radius:1px;}
    .accentBar[data-cat="tech"]{background:var(--tech);}
    .accentBar[data-cat="foot"]{background:var(--foot);}
    .accentBar[data-cat="geo"]{background:var(--geo);}
    .accentBar[data-cat="finance"]{background:var(--finance);}
    .accentBar[data-cat="sport"]{background:var(--sport);}
    .article{display:flex;flex-direction:column;gap:5px;padding:14px 0;border-bottom:1px solid var(--border);text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent;}
    .article:active{opacity:0.5;}
    .article:last-child{border-bottom:none;}
    .articleMeta{display:flex;align-items:center;gap:6px;}
    .articleSource{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);}
    .articleDot{width:2px;height:2px;border-radius:50%;background:var(--dim);flex-shrink:0;}
    .articleTime{font-size:11px;color:var(--muted);font-weight:300;}
    .articleTitle{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;line-height:1.35;}
    .loader{display:flex;gap:6px;justify-content:center;padding:56px 0;}
    .loader span{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:pulse 1.2s ease-in-out infinite;}
    .loader span:nth-child(2){animation-delay:.2s;}
    .loader span:nth-child(3){animation-delay:.4s;}
    @keyframes pulse{0%,80%,100%{transform:scale(.8);opacity:.4;}40%{transform:scale(1.2);opacity:1;}}
    .stateMsg{padding:48px 0;text-align:center;color:var(--muted);font-size:14px;line-height:1.7;}
    .retryBtn{margin-top:14px;display:inline-block;padding:8px 20px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:13px;cursor:pointer;background:var(--surface);font-family:'DM Sans',sans-serif;}
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="headerBack">← Intent</a>
    <h1>Actus</h1>
    <span class="headerDate" id="headerDate"></span>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="feed" id="feed"></div>

  <script>
  const CATEGORIES = [
    { id:"tech",    label:"⚡ Tech & IA"   },
    { id:"foot",    label:"⚽ Foot"         },
    { id:"geo",     label:"🌍 Géopolitique" },
    { id:"finance", label:"📈 Finance"      },
    { id:"sport",   label:"🏅 Sport FR"     }
  ];

  const CACHE_TTL = 10 * 60 * 1000;
  const cache = {};
  let currentCat = sessionStorage.getItem("news_cat") || "tech";

  document.getElementById("headerDate").textContent =
    new Date().toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long" });

  const tabsEl = document.getElementById("tabs");
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "tab" + (cat.id === currentCat ? " active" : "");
    btn.dataset.cat = cat.id;
    btn.textContent = cat.label;
    btn.addEventListener("click", () => selectCat(cat.id));
    tabsEl.appendChild(btn);
  });

  loadFeed(currentCat);

  function selectCat(id) {
    currentCat = id;
    sessionStorage.setItem("news_cat", id);
    document.querySelectorAll(".tab").forEach(t =>
      t.classList.toggle("active", t.dataset.cat === id)
    );
    loadFeed(id);
  }

  async function loadFeed(catId) {
    const feed = document.getElementById("feed");
    if (cache[catId] && Date.now() - cache[catId].ts < CACHE_TTL) {
      renderArticles(cache[catId].articles, catId); return;
    }
    feed.innerHTML = '<div class="loader"><span></span><span></span><span></span></div>';
    try {
      const res  = await fetch("/.netlify/functions/rss?cat=" + catId, { signal: AbortSignal.timeout(12000) });
      const json = await res.json();
      if (!json.ok || !json.articles.length) { showError(catId, "Aucun article."); return; }
      cache[catId] = { articles: json.articles, ts: Date.now() };
      renderArticles(json.articles, catId);
    } catch(e) {
      showError(catId, "Erreur de chargement.");
    }
  }

  function showError(catId, msg) {
    document.getElementById("feed").innerHTML =
      '<div class="stateMsg">' + msg + '<br><button class="retryBtn" onclick="retry(\'' + catId + '\')">Réessayer</button></div>';
  }
  function retry(catId) { delete cache[catId]; loadFeed(catId); }
  window.retry = retry;

  function timeAgo(dateStr) {
    if (!dateStr) return "";
    const diff = Date.now() - new Date(dateStr).getTime();
    const h = Math.floor(diff / 3600000), m = Math.floor(diff / 60000);
    if (h > 48) return Math.floor(h/24) + "j";
    if (h >= 1) return h + "h";
    if (m >= 1) return m + "min";
    return "à l'instant";
  }

  function renderArticles(articles, catId) {
    document.getElementById("feed").innerHTML =
      '<div class="accentBar" data-cat="' + catId + '"></div>' +
      articles.map(a =>
        '<a class="article" href="' + a.link + '" target="_blank" rel="noopener noreferrer">' +
          '<div class="articleMeta"><span class="articleSource">' + a.source + '</span>' +
          '<span class="articleDot"></span><span class="articleTime">' + timeAgo(a.pubDate) + '</span></div>' +
          '<div class="articleTitle">' + a.title + '</div></a>'
      ).join("");
  }
  </script>
</body>
</html>
