<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intent — Actus</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap');

    :root {
      --bg: #08090c;
      --surface: #111218;
      --border: rgba(255,255,255,0.07);
      --text: #eeeef3;
      --muted: rgba(255,255,255,0.38);
      --dim: rgba(255,255,255,0.12);

      --tech:   #4facfe;
      --foot:   #43e97b;
      --geo:    #f7971e;
      --finance:#a78bfa;
      --sport:  #f953c6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* ----- HEADER ----- */
    header {
      padding: 28px 20px 16px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    header h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.3px;
    }

    .headerBack {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }

    .headerBack:hover { color: var(--text); }

    .headerDate {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      font-weight: 300;
    }

    /* ----- TABS ----- */
    .tabs {
      display: flex;
      gap: 6px;
      padding: 0 16px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .tab.active {
      color: var(--bg);
      border-color: transparent;
      font-weight: 700;
    }

    .tab[data-cat="tech"].active   { background: var(--tech); }
    .tab[data-cat="foot"].active   { background: var(--foot); }
    .tab[data-cat="geo"].active    { background: var(--geo); }
    .tab[data-cat="finance"].active{ background: var(--finance); }
    .tab[data-cat="sport"].active  { background: var(--sport); }

    /* ----- FEED ----- */
    .feed {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    /* ----- ARTICLE ----- */
    .article {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: opacity 0.15s;
    }

    .article:active { opacity: 0.6; }
    .article:last-child { border-bottom: none; }

    .articleMeta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .articleSource {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
    }

    .articleDot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--dim);
      flex-shrink: 0;
    }

    .articleTime {
      font-size: 11px;
      color: var(--muted);
      font-weight: 300;
    }

    .articleTitle {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text);
    }

    .articleDesc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      font-weight: 300;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ----- ÉTAT CHARGEMENT / ERREUR ----- */
    .stateMsg {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      font-weight: 300;
    }

    .loader {
      display: flex;
      gap: 6px;
      justify-content: center;
      padding: 40px 0;
    }

    .loader span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--dim);
      animation: pulse 1.2s ease-in-out infinite;
    }

    .loader span:nth-child(2) { animation-delay: 0.2s; }
    .loader span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.4; }
      40%           { transform: scale(1.2); opacity: 1; }
    }

    /* ----- ACCENT BAR ----- */
    .accentBar {
      height: 2px;
      width: 100%;
      margin-bottom: 16px;
      border-radius: 1px;
      opacity: 0.6;
    }

    .accentBar[data-cat="tech"]    { background: var(--tech); }
    .accentBar[data-cat="foot"]    { background: var(--foot); }
    .accentBar[data-cat="geo"]     { background: var(--geo); }
    .accentBar[data-cat="finance"] { background: var(--finance); }
    .accentBar[data-cat="sport"]   { background: var(--sport); }
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="headerBack">← Intent</a>
    <h1>Actus</h1>
    <span class="headerDate" id="headerDate"></span>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="feed" id="feed">
    <div class="loader"><span></span><span></span><span></span></div>
  </div>

  <script>
  /* =========================================================
     CONFIG — Sources RSS par catégorie
     Proxy : allorigins.win (gratuit, pas de clé API)
  ========================================================= */

  const CATEGORIES = [
    {
      id: "tech",
      label: "⚡ Tech & IA",
      sources: [
        { name: "The Verge",  url: "https://www.theverge.com/rss/index.xml" },
        { name: "TechCrunch", url: "https://techcrunch.com/feed/" },
      ]
    },
    {
      id: "foot",
      label: "⚽ Foot",
      sources: [
        { name: "L'Équipe",      url: "https://www.lequipe.fr/rss/actu_rss_Football.xml" },
        { name: "Foot Mercato",  url: "https://www.footmercato.net/flux-rss.xml" },
      ]
    },
    {
      id: "geo",
      label: "🌍 Géopolitique",
      sources: [
        { name: "Le Monde",           url: "https://www.lemonde.fr/international/rss_full.xml" },
        { name: "Courrier Int.",       url: "https://www.courrierinternational.com/feed/all/rss.xml" },
      ]
    },
    {
      id: "finance",
      label: "📈 Finance",
      sources: [
        { name: "Les Échos", url: "https://feeds.lesechos.fr/rss_les_echos_finance.xml" },
        { name: "BFM Bourse", url: "https://www.bfmtv.com/rss/economie/bourse/" },
      ]
    },
    {
      id: "sport",
      label: "🏅 Sport FR",
      sources: [
        { name: "L'Équipe Sport", url: "https://www.lequipe.fr/rss/actu_rss.xml" },
        { name: "Eurosport",      url: "https://www.eurosport.fr/rss.xml" },
      ]
    }
  ];

  const PROXY = "https://api.allorigins.win/get?url=";
  const CACHE_TTL = 15 * 60 * 1000; // 15 min

  /* ---------------------------------------------------------
     STATE
  --------------------------------------------------------- */

  let currentCat = CATEGORIES[0].id;
  const cache = {};

  /* ---------------------------------------------------------
     DATE HEADER
  --------------------------------------------------------- */

  document.getElementById("headerDate").textContent =
    new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });

  /* ---------------------------------------------------------
     TABS
  --------------------------------------------------------- */

  const tabsEl = document.getElementById("tabs");

  CATEGORIES.forEach((cat, i) => {
    const btn = document.createElement("button");
    btn.className = "tab" + (i === 0 ? " active" : "");
    btn.dataset.cat = cat.id;
    btn.textContent = cat.label;
    btn.addEventListener("click", () => selectCat(cat.id));
    tabsEl.appendChild(btn);
  });

  function selectCat(id) {
    currentCat = id;
    document.querySelectorAll(".tab").forEach(t =>
      t.classList.toggle("active", t.dataset.cat === id)
    );
    loadFeed(id);
  }

  /* ---------------------------------------------------------
     FETCH RSS via proxy
  --------------------------------------------------------- */

  async function fetchFeed(source) {
    const url = PROXY + encodeURIComponent(source.url);
    const res  = await fetch(url);
    const json = await res.json();
    return parseFeed(json.contents, source.name);
  }

  function parseFeed(xml, sourceName) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xml, "text/xml");
    const items = [...doc.querySelectorAll("item, entry")];

    return items.slice(0, 8).map(item => {
      const title = item.querySelector("title")?.textContent?.trim() || "";
      const link  = item.querySelector("link")?.textContent?.trim()
                 || item.querySelector("link")?.getAttribute("href") || "#";
      const desc  = item.querySelector("description, summary")?.textContent
                      ?.replace(/<[^>]+>/g, "")?.trim() || "";
      const pubDate = item.querySelector("pubDate, published, updated")?.textContent || "";

      return { title, link, desc, pubDate, source: sourceName };
    }).filter(a => a.title && a.link !== "#");
  }

  function timeAgo(dateStr) {
    if (!dateStr) return "";
    const diff = Date.now() - new Date(dateStr).getTime();
    const h = Math.floor(diff / 3600000);
    const m = Math.floor(diff / 60000);
    if (h > 48) return Math.floor(h / 24) + "j";
    if (h >= 1)  return h + "h";
    if (m >= 1)  return m + "min";
    return "maintenant";
  }

  /* ---------------------------------------------------------
     LOAD & RENDER
  --------------------------------------------------------- */

  async function loadFeed(catId) {
    const feed = document.getElementById("feed");
    const cat  = CATEGORIES.find(c => c.id === catId);
    if (!cat) return;

    // Cache
    if (cache[catId] && Date.now() - cache[catId].ts < CACHE_TTL) {
      renderArticles(cache[catId].articles, catId);
      return;
    }

    // Loading
    feed.innerHTML = `<div class="loader"><span></span><span></span><span></span></div>`;

    try {
      const results = await Promise.allSettled(cat.sources.map(s => fetchFeed(s)));

      const articles = results
        .filter(r => r.status === "fulfilled")
        .flatMap(r => r.value)
        .sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

      if (!articles.length) throw new Error("Aucun article");

      cache[catId] = { articles, ts: Date.now() };
      renderArticles(articles, catId);

    } catch(e) {
      feed.innerHTML = `
        <div class="stateMsg">
          Impossible de charger les articles.<br>
          <small style="opacity:.5">${e.message}</small>
        </div>`;
    }
  }

  function renderArticles(articles, catId) {
    const feed = document.getElementById("feed");

    feed.innerHTML = `<div class="accentBar" data-cat="${catId}"></div>` +
      articles.map(a => `
        <a class="article" href="${a.link}" target="_blank" rel="noopener">
          <div class="articleMeta">
            <span class="articleSource">${a.source}</span>
            <span class="articleDot"></span>
            <span class="articleTime">${timeAgo(a.pubDate)}</span>
          </div>
          <div class="articleTitle">${a.title}</div>
          ${a.desc ? `<div class="articleDesc">${a.desc}</div>` : ""}
        </a>
      `).join("");
  }

  /* ---------------------------------------------------------
     INIT
  --------------------------------------------------------- */

  loadFeed(currentCat);
  </script>
</body>
</html>
